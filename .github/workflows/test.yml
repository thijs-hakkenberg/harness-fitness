name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 is the floor a stock macOS ships. It is in the matrix so the
        # stdlib-only rule for hook code is enforced rather than aspirational.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-bdd coverage

      - name: Run suite
        env:
          HFIT_COVERAGE_SOURCE: ${{ github.workspace }}/hooks
        run: |
          python -m coverage erase
          python -m coverage run -m pytest -q
          python -m coverage combine
          python -m coverage report
