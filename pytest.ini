[pytest]
testpaths = tests

# Feature files live at the repo root rather than beside their step definitions,
# because `features/` is the artefact a reviewer reads. Keeping them out of
# `tests/` stops them becoming a second copy of the test suite.
bdd_features_base_dir = features

markers =
    slow: exercises a real subprocess or a real `bd`; skipped unless opted in
    real_bd: requires a real `bd` binary and HFIT_REAL_BD_TESTS=1
